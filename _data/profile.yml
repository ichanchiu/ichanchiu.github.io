research_statement:
  en: I study how assets are priced—and what financial language and artificial intelligence reveal beyond market prices.
  zh: 我研究資產如何被定價，以及金融語言與人工智慧如何揭示市場價格尚未充分反映的資訊。
summary:
  en: My work connects empirical financial economics with applied AI, spanning investor expectations, financial disclosures, return predictability, and risk measurement.
  zh: 我的研究連結實證金融經濟學與應用人工智慧，涵蓋投資人預期、金融揭露、報酬可預測性與風險衡量。
