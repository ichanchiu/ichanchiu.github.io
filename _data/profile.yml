headline:
  en: Asset Pricing, Financial Text, and Artificial Intelligence
  zh: 資產定價、金融文本與人工智慧
summary:
  en: My research combines asset pricing and financial economics with large language models, natural language processing, and interpretable machine learning to study financial disclosures, market text, investor expectations, and risk, while exploring practical applications in financial decision-making.
  zh: 我的研究結合資產定價與金融經濟學，運用大型語言模型、自然語言處理與可解釋機器學習，研究金融揭露、市場文本、投資人預期與風險，並探索其在金融決策中的實際應用。
